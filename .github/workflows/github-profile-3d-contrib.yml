name: GitHub-Profile-3D-Contrib

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"

  # allows to manually run the job at any time
  workflow_dispatch:

  # run on every push on the main branch, so the output branch exists right after merge
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates 3D contribution calendars into profile-3d-contrib/
      - name: generate github-profile-3d-contrib svgs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          # the PAT includes contributions from private repositories
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # push the generated svgs to a branch without history, keeping main free of bot commits
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/github-profile-3d-contrib-output/<file>
      - name: push svgs to the github-profile-3d-contrib-output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: github-profile-3d-contrib-output
          build_dir: profile-3d-contrib
        env:
          # pushing to this repo only needs contents: write, so the built-in token is enough
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
